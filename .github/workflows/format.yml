name: Format
on:
    workflow_dispatch:
permissions:
    contents: read

jobs:
    Format:
        name: Format
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PNPM
              uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Format
              run: |
                  pnpm fmt
                  git diff --name-only > formatted-files.txt
                  cat formatted-files.txt
                  tar czf formatted.tgz formatted-files.txt $(cat formatted-files.txt)

            - name: Upload the formatted files
              uses: actions/upload-artifact@v4
              with:
                  name: formatted
                  path: formatted.tgz
